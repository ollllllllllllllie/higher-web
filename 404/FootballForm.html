<head>
    <style>
        body {text-align: center;}
    </style>
</head>
<body>
    <header>
        <h1 class="title">Please input into this form</h1>
    </header>
    <form action="FootballForm.html" method="get">
        <label for="fname">Please Input Your first name</label>
        <input name="fname" id="fname" type="text" required>
        <br></br>
        <label for="lname">Please Input Your last name</label>
        <input name="lname" id="lname" type="text" required>
        <br></br>
        <label for="age" >Input your age (between 8 and 12)</label>
        <input name="age" id="age" type="number" min="8" max="12" required>
        <br></br>
        <label for="email">input your email</label>
        <input name="email" id="email" type="email" required>
        <br></br>
        <label for="phone">input your phone number</label>
        <input name="phone" id="phone" type="num" pattern="[0-9]{4} [0-9]{3} [0-9]{4}" required>
        <br></br>
        <label for="shirtSize">Whats your shirt size</label>
        <select id="shirtSize" name="Shirt Size">
        <option value="EXTRA LARGE">XL</option>
        <option value="LARGE">L</option>
        <option value="MEDIUM">M</option>
        <option value="SMALL">S</option>
        <option value="EXTRA SMALL">XS</option>
        </select>

        <br></br>

        <label for="xp"> Whats your previous football experience?</label>
        <input type="radio" id="xp" name="experience" value="none"> none
        <input type="radio" id="xp" name="experience" value="1-2 Years"> 1-2 Years
        <input type="radio" id="xp" name="experience" value="+3 Years"> +3 Years
        
        <br></br>
        <input type="submit" value="submit">
    </form>
</body>
